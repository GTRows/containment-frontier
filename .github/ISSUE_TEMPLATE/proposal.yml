name: Improvement proposal
description: Propose a focused campaign or distribution improvement.
title: 'feat: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
      description: Explain the gameplay or contribution problem and the result you want.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Progression and compatibility
      description: Describe affected technology tiers, automation, solo/team play and possible save effects. Use "None" for documentation-only proposals.
    validations:
      required: true
